# Static checks + unit tests. GitHub Actions compatible; this Gitea instance
# runs these workflows with act_runner (label "ubuntu-latest", a Debian-based
# image, so apt-get has shellcheck and bats).
#
# NOTE: actions/checkout cannot be used here. Gitea runs under a subpath
# (ROOT_URL https://secure.verboom.net/git/) and the runner gets a clone URL
# without the subpath, which checkout chokes on (upstream actions/checkout
# limitation, see gitea#33629). Plain git clone against the direct Gitea
# address (GITHUB_SERVER_URL) is the documented workaround.
name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone --depth 1 --branch "${{ github.ref_name }}" "$GITHUB_SERVER_URL/git/$GITHUB_REPOSITORY.git" .
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends shellcheck
      - name: Lint scripts
        run: shellcheck build cacheclean security-scan security-scan-apply torepo build-completion test/helper.bash

  bats:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone --depth 1 --branch "${{ github.ref_name }}" "$GITHUB_SERVER_URL/git/$GITHUB_REPOSITORY.git" .
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bats
      - name: Run test suite
        run: bats test